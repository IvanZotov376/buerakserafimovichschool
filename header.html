<header class="header">
    <div class="container header-content">
        <div class="logo">
            <img src="logo1.png" alt="Логотип">
        </div>
        <div class="title">
            <h1>МКОУ Буерак-Поповская СКШ</h1>
            <p>
                Муниципальное казенное общеобразовательное учреждение<br>
                Буерак-Поповская средняя казачья школа
            </p>
        </div>
        <div class="header-icons">
            <i class="fa-solid fa-eye" id="accessibilityBtn" title="Настройки доступности"></i>

            <div class="user-block" id="userBlock" style="display: none;">
                <div class="user-avatar" id="userAvatar"></div>
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
            </div>

            <!-- Надёжная кнопка входа: работает даже без JS, потому что это ссылка -->
            <a class="login-link" id="loginBtn" href="login.html" title="Войти в профиль" aria-label="Войти в профиль" style="display: inline-flex; color: white; text-decoration: none; cursor: pointer;">
                <i class="fa-solid fa-user"></i>
            </a>

            <i class="fa-solid fa-right-from-bracket" id="logoutBtn" title="Выйти" style="display: none;"></i>

            <div class="accessibility-panel" id="accessibilityPanel">
                <button class="close-panel" id="closeAccessibilityPanel" type="button">&times;</button>
                <h4><i class="fa-solid fa-universal-access"></i> Специальные возможности</h4>

                <div class="option-group">
                    <label>Цветовая тема</label>
                    <div class="option-buttons" data-group="theme">
                        <button class="option-btn active" data-value="original" type="button">Оригинальная</button>
                        <button class="option-btn" data-value="dark" type="button">Тёмная</button>
                        <button class="option-btn" data-value="blue" type="button">Синяя</button>
                    </div>
                </div>

                <div class="option-group">
                    <label>Размер шрифта</label>
                    <div class="option-buttons" data-group="fontSize">
                        <button class="option-btn active" data-value="1" type="button">1x</button>
                        <button class="option-btn" data-value="2" type="button">2x</button>
                        <button class="option-btn" data-value="3" type="button">3x</button>
                        <button class="option-btn" data-value="4" type="button">4x</button>
                    </div>
                </div>

                <div class="option-group">
                    <label>Эффекты</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="noEffectsCheckbox">
                        <label for="noEffectsCheckbox">Отключить анимацию и градиенты</label>
                    </div>
                </div>

                <div class="option-group">
                    <label>Изображения</label>
                    <div class="option-buttons" data-group="imageMode">
                        <button class="option-btn active" data-value="original" type="button">Оригинал</button>
                        <button class="option-btn" data-value="grayscale" type="button">Чёрно-белые</button>
                        <button class="option-btn" data-value="hide" type="button">Отключить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
