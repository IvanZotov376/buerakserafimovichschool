<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="icon" type="image/png" href="logo1.png">
  <!-- Шрифты и иконки -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Raleway', sans-serif;
      background: linear-gradient(135deg, #2ea3d0, #3a5fa0);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 16px;
    }

    .container {
      background: rgba(255, 255, 255, 0.12);
      padding: 48px 56px;
      border-radius: 36px;
      width: 100%;
      max-width: 780px;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      margin-bottom: 44px;
      color: white;
      text-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .field {
      margin-top: 22px;
    }

    /* --- общие стили для полей ввода --- */
    input,
    .select-selected {
      width: 100%;
      height: 64px;
      padding: 0 20px;
      border-radius: 20px;
      border: none;
      outline: none;
      font-family: 'Raleway', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #1e3a6b;
      background: #ffffff;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
      transition: box-shadow 0.2s;
    }

    input:focus,
    .select-selected:focus-visible {
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    }

    input::placeholder {
      font-weight: 400;
      opacity: 0.5;
      color: #1e3a6b;
    }

    /* --- поле пароля и звёздочки --- */
    .password-wrapper {
      position: relative;
    }

    #password {
      background: #ffffff;
      color: transparent;          /* по умолчанию текст скрыт */
      caret-color: #1e3a6b;
      position: relative;
      z-index: 3;
    }

    .fake-password {
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      color: #1e3a6b;
      font-size: 20px;
      font-weight: 700;
      pointer-events: none;
      z-index: 4;
      letter-spacing: 3px;
      white-space: nowrap;
      background: transparent;
    }

    .fake-password span {
      display: inline-block;
    }

    /* Глаз — точное выравнивание */
    .eye {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      color: #1e3a6b;
      cursor: pointer;
      z-index: 6;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .eye:hover {
      background: rgba(30, 58, 107, 0.08);
    }

    /* --- кастомный селект --- */
    .custom-select {
      position: relative;
    }

    .select-selected {
      display: flex;
      align-items: center;
      cursor: pointer;
      background: white;
    }

    .select-selected::after {
      content: "";
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      border-right: 3px solid #1e3a6b;
      border-bottom: 3px solid #1e3a6b;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .select-selected.open::after {
      transform: translateY(-50%) rotate(225deg);
    }

    .select-items {
      position: absolute;
      top: calc(100% + 8px);
      width: 100%;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
      z-index: 20;
    }

    .select-items.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .select-items div {
      padding: 18px 20px;
      font-weight: 700;
      font-size: 18px;
      color: #1e3a6b;
      cursor: pointer;
      transition: background 0.15s;
    }

    .select-items div:hover {
      background: #2ea3d0;
      color: white;
    }

    /* --- чекбокс (согласие) --- */
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 24px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }

    .checkbox-wrapper input {
      display: none;
    }

    .custom-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .custom-checkbox::after {
      content: "✔";
      color: white;
      font-size: 16px;
      display: none;
    }

    .checkbox-wrapper input:checked + .custom-checkbox {
      background: white;
      border-color: white;
    }

    .checkbox-wrapper input:checked + .custom-checkbox::after {
      display: block;
      color: #3a5fa0;
    }

    .checkbox-wrapper a {
      color: white;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* --- КНОПКА ВХОДА — инвертирование цвета при наведении --- */
    button {
      width: 100%;
      height: 64px;
      margin-top: 32px;
      border: none;
      border-radius: 24px;
      background: white;
      color: #1e3a6b;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
      transition: background 0.25s, color 0.25s, box-shadow 0.2s;
      font-family: 'Raleway', sans-serif;
    }

    button:hover {
      background: #1e3a6b;
      color: white;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      transform: none;
    }

    /* ссылка внизу */
    .bottom-link {
      text-align: center;
      margin-top: 28px;
      font-weight: 500;
      font-size: 16px;
    }

    .bottom-link a {
      color: white;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid rgba(255,255,255,0.5);
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Вход</h2>

  <!-- Логин -->
  <input class="field" type="text" id="login" placeholder="Логин" autocomplete="off" value="">

  <!-- Электронная почта (новое поле между логином и паролем) -->
  <input class="field" type="email" id="email" placeholder="Электронная почта" autocomplete="off" value="">

  <!-- Пароль с кастомными звёздочками -->
  <div class="password-wrapper field">
    <input type="text" id="password" placeholder="Пароль" autocomplete="off" value="">
    <div class="fake-password" id="fakePassword"></div>
    <i class="fa-solid fa-eye eye" id="eye" title="Показать пароль"></i>
  </div>

  <!-- Кастомный селект роли -->
  <div class="custom-select field">
    <div class="select-selected" id="selectedRole">Выберите роль</div>
    <div class="select-items" id="roleList">
      <div data-value="Ученик">Ученик</div>
      <div data-value="Родитель">Родитель</div>
      <div data-value="Преподаватель">Преподаватель</div>
      <div data-value="Администратор">Администратор</div>
      <div data-value="Гость">Гость</div>
    </div>
  </div>

  <!-- Чекбокс обработки данных -->
  <label class="checkbox-wrapper">
    <input type="checkbox" id="agree">
    <div class="custom-checkbox"></div>
    <span>
      Я согласен на 
      <a href="https://www.consultant.ru/document/cons_doc_LAW_61801/" target="_blank" rel="noopener">
        обработку персональных данных
      </a>
    </span>
  </label>

  <!-- Кнопка входа -->
  <button onclick="loginUser()">Войти</button>

  <!-- Ссылка на сайт -->
  <div class="bottom-link">
    Перейти на сайт:
    <a href="https://sgo.volganet.ru" target="_blank" rel="noopener">sgo.volganet</a>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ---------- РАБОТА С СЕЛЕКТОМ РОЛИ ----------
    let selectedRole = "";
    const selectedDiv = document.getElementById('selectedRole');
    const roleList = document.getElementById('roleList');

    selectedDiv.addEventListener('click', (e) => {
      e.stopPropagation();
      roleList.classList.toggle('show');
      selectedDiv.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.custom-select')) {
        roleList.classList.remove('show');
        selectedDiv.classList.remove('open');
      }
    });

    document.querySelectorAll('#roleList div').forEach(item => {
      item.addEventListener('click', () => {
        selectedRole = item.dataset.value;
        selectedDiv.textContent = selectedRole;
        roleList.classList.remove('show');
        selectedDiv.classList.remove('open');
      });
    });

    // ---------- ВОССТАНОВЛЕНИЕ ПОСЛЕДНЕГО ВХОДА ----------
    const savedLogin = localStorage.getItem('login') || '';
    const savedEmail = localStorage.getItem('email') || '';
    const savedRole = localStorage.getItem('role') || '';
    if (savedLogin) document.getElementById('login').value = savedLogin;
    if (savedEmail) document.getElementById('email').value = savedEmail;
    if (savedRole) {
      const savedRoleItem = [...document.querySelectorAll('#roleList div')].find(item => item.dataset.value === savedRole);
      if (savedRoleItem) {
        selectedRole = savedRole;
        selectedDiv.textContent = savedRole;
      }
    }


    // ---------- ПОЛЕ ПАРОЛЯ: ЗВЁЗДОЧКИ И ПЕРЕКЛЮЧЕНИЕ ВИДИМОСТИ ----------
    const passwordInput = document.getElementById('password');
    const fakeContainer = document.getElementById('fakePassword');
    const eyeIcon = document.getElementById('eye');
    let passwordVisible = false;

    function updateFakeStars() {
      const val = passwordInput.value;
      fakeContainer.innerHTML = '';
      for (let i = 0; i < val.length; i++) {
        const starSpan = document.createElement('span');
        starSpan.textContent = '*';
        fakeContainer.appendChild(starSpan);
      }
    }

    passwordInput.addEventListener('input', updateFakeStars);

    eyeIcon.addEventListener('click', () => {
      passwordVisible = !passwordVisible;

      if (passwordVisible) {
        passwordInput.style.color = '#1e3a6b';
        fakeContainer.style.display = 'none';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
        eyeIcon.title = 'Скрыть пароль';
      } else {
        passwordInput.style.color = 'transparent';
        fakeContainer.style.display = 'flex';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
        eyeIcon.title = 'Показать пароль';
        updateFakeStars();
      }
    });

    // Инициализация: скрытый режим
    passwordInput.style.color = 'transparent';
    fakeContainer.style.display = 'flex';
    updateFakeStars();

    // ---------- ВАЛИДАЦИЯ EMAIL ----------
    function isValidEmail(email) {
      // Простая, но достаточная проверка
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }


    function getDefaultAvatarColor(name) {
      let hash = 0;
      const source = name || 'user';
      for (let i = 0; i < source.length; i++) {
        hash = source.charCodeAt(i) + ((hash << 5) - hash);
      }
      const colors = [
        'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
        'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
        'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
        'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
        'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'
      ];
      return colors[Math.abs(hash) % colors.length];
    }

    // ---------- ФУНКЦИЯ ВХОДА ----------
    window.loginUser = async function() {
      const login = document.getElementById('login').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      const agreeChecked = document.getElementById('agree').checked;

      if (!login) { alert('Пожалуйста, введите логин'); return; }
      if (!email) { alert('Пожалуйста, введите адрес электронной почты'); return; }
      if (!isValidEmail(email)) { alert('Введите корректный адрес электронной почты'); return; }
      if (!password) { alert('Введите пароль'); return; }
      if (!selectedRole) { alert('Выберите роль из списка'); return; }
      if (!agreeChecked) { alert('Необходимо согласие на обработку персональных данных'); return; }

      const API_URL = (() => {
        const saved = localStorage.getItem('api_url');
        if (saved) return saved.replace(/\/$/, '');
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          const host = window.location.hostname || '127.0.0.1';
          return `${window.location.protocol}//${host}:5000`;
        }
        return 'http://127.0.0.1:5000';
      })();

      const avatarColor = localStorage.getItem('avatar_color') || getDefaultAvatarColor(login);

      function saveLocalUser(user) {
        const roleToSave = user?.role || selectedRole;
        const fullNameToSave = user?.full_name || login;
        const avatarToSave = user?.avatar_color || avatarColor;

        localStorage.setItem('auth', 'true');
        localStorage.setItem('login', login);
        localStorage.setItem('email', email);
        localStorage.setItem('password', password);
        localStorage.setItem('role', roleToSave);
        localStorage.setItem('full_name', fullNameToSave);
        localStorage.setItem('avatar_color', avatarToSave);
      }

      try {
        const payload = { login, email, password, role: selectedRole, full_name: login, avatar_color: avatarColor };

        const response = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) {
          alert(data.error || 'Ошибка входа');
          return;
        }

        saveLocalUser(data.user);
        window.location.href = 'lk.html';
      } catch (error) {
        console.warn('Сервер недоступен, вход сохранён локально:', error);
        saveLocalUser({ role: selectedRole, full_name: login, avatar_color: avatarColor });
        window.location.href = 'lk.html';
      }
    };

    // Убираем лишние пробелы в логине и email при потере фокуса
    const loginInput = document.getElementById('login');
    const emailInput = document.getElementById('email');
    loginInput.addEventListener('blur', () => {
      loginInput.value = loginInput.value.trim();
    });
    emailInput.addEventListener('blur', () => {
      emailInput.value = emailInput.value.trim();
    });

  })();
</script>

</body>
</html>
