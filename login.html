<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>

  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Raleway', sans-serif;
      background: linear-gradient(135deg, #2ea3d0, #3a5fa0);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.12);
      padding: 40px;
      border-radius: 30px;
      width: 100%;
      max-width: 500px;
      backdrop-filter: blur(15px);
      text-align: center;
    }

    h2 {
      font-weight: 800;
      margin-bottom: 30px;
    }

    input, select {
      width: 100%;
      height: 50px;
      margin-top: 15px;
      border-radius: 15px;
      border: none;
      padding: 0 15px;
      font-size: 16px;
      font-weight: 700;
    }

    button {
      margin-top: 25px;
      width: 100%;
      height: 50px;
      border-radius: 15px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Вход</h2>

  <input type="text" id="login" placeholder="Логин">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Пароль">

  <select id="role">
    <option>Ученик</option>
    <option>Родитель</option>
    <option>Учитель</option>
    <option>Администратор</option>
  </select>

  <button type="button" id="loginBtn">Войти</button>
</div>

<script>
document.getElementById("loginBtn").onclick = function () {
    const login = document.getElementById("login").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const role = document.getElementById("role").value;

    if (!login || !email || !password) {
        alert("Заполните все поля");
        return;
    }

    // сохраняем авторизацию
    localStorage.setItem("auth", "true");
    localStorage.setItem("login", login);
    localStorage.setItem("full_name", login);
    localStorage.setItem("role", role);

    // переход на главную
    window.location.href = "index.html";
};
</script>

</body>
</html>
